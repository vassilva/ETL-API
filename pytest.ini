[pytest]
pythonpath = src
testpaths = tests
addopts = --strict-markers
junit_family = xunit2
junit_logging = no
markers =
    extract: Validates the Extract boundary (Source -> RAW) or source data
    transform: Validates the Transform boundary (RAW -> Processed)
    load: Validates the Load boundary or the loaded target (Processed -> PostgreSQL)
    api: OFFLINE tests of our API client layer (mocked HTTP; no network). For tests against the real source API use live_api
    unit: Offline tests using synthetic data (no network, database, credentials or pipeline artifacts)
    live_api: Performs GET requests against the external source API (requires network)
    database: Requires PostgreSQL and DB credentials; the test session is enforced read-only
    artifacts: Requires the RUNTIME output of a real ETL run in data/ (the committed snapshot in tests/fixtures/snapshot is not an artifact dependency)
    integration: Requires an external system or runtime ETL output. Applied automatically to every live_api, database and artifacts test; offline selections exclude it
    e2e: Re-runs the real ETL (live API -> data/ -> PostgreSQL). WRITES to data/ and the database; skipped unless --run-e2e is given
    sanity: DERIVED (never apply by hand): every offline test. Push gate (Sanity); runs in every build
    smoke: PR critical path on the real ETL run (Smoke gate). Applied by hand, only to integration tests
    regression: DERIVED (never apply by hand): every integration test not marked smoke. Pre-merge gate (Regression)
