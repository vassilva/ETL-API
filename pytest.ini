[pytest]
pythonpath = src
testpaths = tests
addopts = --strict-markers
junit_family = xunit2
junit_logging = no
markers =
    extract: Extract stage tests
    transform: Transform stage tests
    load: Load stage tests (validate data loaded into PostgreSQL)
    api: OFFLINE tests of our API client layer (mocked HTTP; no network). For tests against the real source API use live_api
    unit: Offline tests using synthetic data (no network, database, credentials or pipeline artifacts)
    live_api: Performs GET requests against the external source API (requires network)
    database: Requires PostgreSQL and DB credentials; the test session is enforced read-only
    integration: Requires an external system (live API or PostgreSQL). Applied automatically to every live_api and database test
    artifacts: Requires generated pipeline files in data/raw or data/processed
    e2e: Runs the real ETL (live API -> data/ -> PostgreSQL) twice and validates the result. WRITES to data/ and the database; skipped unless --run-e2e is given
    smoke: Representative quick health check for each ETL stage
    regression: Full regression suite (applied automatically to every test)
